{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StayFinder{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="{% url 'room_list' %}" class="text-xl font-bold text-indigo-600">StayFinder</a>
                <div class="hidden sm:flex gap-6 text-sm font-medium text-gray-600">
                    <a href="{% url 'room_list' %}" class="hover:text-indigo-600 transition">Rooms</a>
                    <a href="#" class="hover:text-indigo-600 transition">About</a>
                    <a href="#" class="hover:text-indigo-600 transition">Contact</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-200 mt-16 py-8 text-center text-sm text-gray-500">
        &copy; {% now "Y" %} StayFinder. All rights reserved.
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
